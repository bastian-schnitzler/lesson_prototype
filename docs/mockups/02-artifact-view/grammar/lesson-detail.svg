<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SALT" style="width:920px;height:3030px;background:#020617;" width="920.4px" height="3030.3px" viewBox="0 0 920 3030" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><rect x="0" y="0" width="920.4" height="3030.3" fill="#020617" style="stroke:none;"/><text x="9.1" y="44.34" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><rect x="45.246" y="35.709" width="182" height="23.359" fill="#EEE" style="stroke:#000;stroke-width:3.25;" rx="6.5" ry="6.5"/><text x="71.424" y="52.79" fill="#4338CA" font-size="15.6" textLength="129.645">Lesson overview</text><text x="233.096" y="46.94" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="270.951" y="46.94" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><rect x="304.497" y="35.709" width="150.8" height="23.359" fill="#EEE" style="stroke:#000;stroke-width:3.25;" rx="6.5" ry="6.5"/><text x="333.554" y="52.79" fill="#4338CA" font-size="15.6" textLength="92.686">Start lesson</text><text x="40.696" y="101.458" fill="#1E293B" font-size="15.6" textLength="619.871">──────────────────────────────────────────────────────────────────</text><text x="40.696" y="157.457" fill="#E2E8F0" font-size="31.2" textLength="436.495" font-weight="700">Le verbe être au présent</text><text x="43.296" y="226.015" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="74.892" y="227.315" fill="#1E293B" font-size="15.6" textLength="619.871">──────────────────────────────────────────────────────────────────</text><text x="74.892" y="268.833" fill="#E2E8F0" font-size="15.6" textLength="231.456" font-weight="700">OUTLINE  /  Lesson outline</text><text x="76.192" y="311.652" fill="#94A3B8" font-size="15.6" textLength="68.859">Lesson 4</text><text x="147.652" y="311.652" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="177.948" y="311.652" fill="#E2E8F0" font-size="15.6" textLength="74.428">Grammar</text><text x="266.866" y="311.652" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="297.162" y="311.652" fill="#E2E8F0" font-size="15.6" textLength="78.891">French A1</text><text x="76.192" y="353.171" fill="#E2E8F0" font-size="15.6" textLength="41.887">Topic</text><text x="147.652" y="353.171" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="177.948" y="353.171" fill="#E2E8F0" font-size="15.6" textLength="86.318">Verb forms</text><text x="266.866" y="353.171" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="297.162" y="353.171" fill="#E2E8F0" font-size="15.6" textLength="182.135">ID: fr-verb-etre-present</text><text x="74.892" y="403.23" fill="#E2E8F0" font-size="23.4" textLength="184.035" font-weight="700">Outline intent</text><text x="74.892" y="425.829" fill="#E2E8F0" font-size="15.6" textLength="578.937">Conjuguer être au présent avec tous les pronoms pour dire sa nationalité,</text><text x="74.892" y="446.588" fill="#E2E8F0" font-size="15.6" textLength="373.006">sa profession ou son état : je suis, tu es, il est…</text><text x="698.664" y="226.015" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="43.296" y="556.885" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="74.892" y="558.185" fill="#1E293B" font-size="15.6" textLength="619.871">──────────────────────────────────────────────────────────────────</text><text x="74.892" y="599.704" fill="#E2E8F0" font-size="15.6" textLength="211.088" font-weight="700">DRAFT  /  Grammar plan</text><text x="74.892" y="641.222" fill="#94A3B8" font-size="15.6" textLength="421.429">3 explanation + practice blocks   /   About 13 minutes</text><text x="74.892" y="682.741" fill="#E2E8F0" font-size="15.6" textLength="163.511" font-weight="700">Learning objective</text><text x="74.892" y="703.501" fill="#E2E8F0" font-size="15.6" textLength="423.424">Choose the present-tense form of être for the subject.</text><text x="76.192" y="746.319" fill="#E2E8F0" font-size="15.6" textLength="47.577" font-weight="700">Block</text><text x="235.066" y="746.319" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="265.363" y="746.319" fill="#E2E8F0" font-size="15.6" textLength="130.124" font-weight="700">Rule / example</text><text x="578.371" y="746.319" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="608.667" y="746.319" fill="#E2E8F0" font-size="15.6" textLength="115.111" font-weight="700">Practice plan</text><text x="76.192" y="787.838" fill="#E2E8F0" font-size="15.6" textLength="138.762">01 Singular forms</text><text x="235.066" y="787.838" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="265.363" y="787.838" fill="#E2E8F0" font-size="15.6" textLength="188.99">je suis; tu es; il / elle est</text><text x="578.371" y="787.838" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="608.667" y="787.838" fill="#E2E8F0" font-size="15.6" textLength="231.631">Pronoun matching and typing</text><text x="76.192" y="829.357" fill="#E2E8F0" font-size="15.6" textLength="118.478">02 Plural forms</text><text x="235.066" y="829.357" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="265.363" y="829.357" fill="#E2E8F0" font-size="15.6" textLength="310.408">nous sommes; vous êtes; ils / elles sont</text><text x="578.371" y="829.357" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="608.667" y="829.357" fill="#E2E8F0" font-size="15.6" textLength="221.752">Choice gaps and typed gaps</text><text x="76.192" y="870.876" fill="#E2E8F0" font-size="15.6" textLength="156.274">03 Forms in context</text><text x="235.066" y="870.876" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="265.363" y="870.876" fill="#E2E8F0" font-size="15.6" textLength="117.419">Tu es étudiant.</text><text x="578.371" y="870.876" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="608.667" y="870.876" fill="#E2E8F0" font-size="15.6" textLength="234.655">Word order and error spotting</text><text x="77.492" y="937.054" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="109.088" y="938.354" fill="#E2E8F0" font-size="15.6" textLength="215.521" font-weight="700">Teaching rule and pitfall</text><text x="109.088" y="979.872" fill="#E2E8F0" font-size="15.6" textLength="235.143">Tu uses es; il and elle use est.</text><text x="109.088" y="1000.632" fill="#E2E8F0" font-size="15.6" textLength="342.111">Example: Tu es étudiant. Elle est étudiante.</text><text x="109.088" y="1021.391" fill="#E2E8F0" font-size="15.6" textLength="449.231">Pitfall: es and est sound alike but have different subjects.</text><text x="562.22" y="937.054" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="74.892" y="1108.329" fill="#E2E8F0" font-size="15.6" textLength="193.659" font-weight="700">Mixed final exam plan</text><text x="74.892" y="1129.088" fill="#E2E8F0" font-size="15.6" textLength="546.526">Pronoun typing + typed gaps; word order only for sentence structure.</text><text x="74.892" y="1149.847" fill="#94A3B8" font-size="15.6" textLength="533.333">Each page defines tested forms, possible points, and its countdown.</text><text x="74.892" y="1170.607" fill="#E2E8F0" font-size="15.6" textLength="582.882">Example: one typed form, 30 seconds; a 3-answer form table, 60 seconds.</text><text x="848.522" y="556.885" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="43.296" y="1280.904" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="74.892" y="1282.204" fill="#1E293B" font-size="15.6" textLength="619.871">──────────────────────────────────────────────────────────────────</text><text x="74.892" y="1323.722" fill="#E2E8F0" font-size="15.6" textLength="253.69" font-weight="700">CONTENT  /  Grammar lesson</text><text x="74.892" y="1365.241" fill="#94A3B8" font-size="15.6" textLength="501.759">Ordered explanation and exercise cards   /   Read-only previews</text><text x="77.492" y="1430.119" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="109.088" y="1431.419" fill="#E2E8F0" font-size="15.6" textLength="211.971" font-weight="700">01  Explanation preview</text><text x="109.088" y="1482.592" fill="#E2E8F0" font-size="26" textLength="362.54" font-weight="700">One person: suis, es, est</text><text x="110.388" y="1527.863" fill="#E2E8F0" font-size="15.6" textLength="13.932">je</text><text x="164.694" y="1527.863" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="194.99" y="1527.863" fill="#E2E8F0" font-size="15.6" textLength="30.476">suis</text><text x="228.066" y="1527.863" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="258.362" y="1527.863" fill="#E2E8F0" font-size="15.6" textLength="34.315">I am</text><text x="110.388" y="1569.382" fill="#E2E8F0" font-size="15.6" textLength="16.004">tu</text><text x="164.694" y="1569.382" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="194.99" y="1569.382" fill="#E2E8F0" font-size="15.6" textLength="17.725">es</text><text x="228.066" y="1569.382" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="258.362" y="1569.382" fill="#E2E8F0" font-size="15.6" textLength="59.193">you are</text><text x="110.388" y="1610.901" fill="#E2E8F0" font-size="15.6" textLength="51.705">il / elle</text><text x="164.694" y="1610.901" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="194.99" y="1610.901" fill="#E2E8F0" font-size="15.6" textLength="23.842">est</text><text x="228.066" y="1610.901" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="258.362" y="1610.901" fill="#E2E8F0" font-size="15.6" textLength="79.691">he / she is</text><rect x="112.338" y="1642.489" width="213.2" height="23.359" fill="#EEE" style="stroke:#000;stroke-width:3.25;" rx="6.5" ry="6.5"/><text x="144.998" y="1659.569" fill="#4338CA" font-size="15.6" textLength="147.88">Listen to examples</text><text x="475.528" y="1430.119" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="77.492" y="1775.716" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="109.088" y="1777.016" fill="#E2E8F0" font-size="15.6" textLength="211.103" font-weight="700">Pronoun typing preview</text><text x="110.388" y="1819.835" fill="#E2E8F0" font-size="15.6" textLength="64.723" font-weight="700">Prompt</text><text x="177.712" y="1819.835" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="208.008" y="1819.835" fill="#E2E8F0" font-size="15.6" textLength="150.554" font-weight="700">Accepted answer</text><text x="361.161" y="1819.835" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="391.457" y="1819.835" fill="#E2E8F0" font-size="15.6" textLength="55.346" font-weight="700">Points</text><text x="110.388" y="1861.354" fill="#E2E8F0" font-size="15.6" textLength="44.363">tu ___</text><text x="177.712" y="1861.354" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="208.008" y="1861.354" fill="#E2E8F0" font-size="15.6" textLength="17.725">es</text><text x="361.161" y="1861.354" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="391.457" y="1861.354" fill="#E2E8F0" font-size="15.6">1</text><text x="110.388" y="1902.872" fill="#E2E8F0" font-size="15.6" textLength="56.222">elle ___</text><text x="177.712" y="1902.872" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="208.008" y="1902.872" fill="#E2E8F0" font-size="15.6" textLength="23.842">est</text><text x="361.161" y="1902.872" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="391.457" y="1902.872" fill="#E2E8F0" font-size="15.6">1</text><text x="109.088" y="1924.932" fill="#E2E8F0" font-size="15.6" textLength="403.368">Correction: Tu takes es. Est is the form for il or elle.</text><text x="516.356" y="1775.716" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="77.492" y="2035.229" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="109.088" y="2036.529" fill="#E2E8F0" font-size="15.6" textLength="315.984" font-weight="700">Choice-gap and typed-gap previews</text><text x="109.088" y="2078.047" fill="#E2E8F0" font-size="15.6" textLength="516.811">Choice prompt: Tu ___ étudiant.   Options: suis / es / est / sommes</text><text x="109.088" y="2098.807" fill="#00E676" font-size="15.6" textLength="85.396">Answer: es</text><text x="109.088" y="2140.326" fill="#E2E8F0" font-size="15.6" textLength="353.064">Typed prompt: Vous ___ prêts.   Answer: êtes</text><text x="109.088" y="2161.085" fill="#E2E8F0" font-size="15.6" textLength="474.703">Correction: Vous takes êtes, with an accent circonflexe on e.</text><text x="109.088" y="2181.844" fill="#E2E8F0" font-size="15.6" textLength="378.97">Same letters without the accent earn 0.5 points.</text><text x="629.799" y="2035.229" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="77.492" y="2292.141" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="109.088" y="2293.441" fill="#E2E8F0" font-size="15.6" textLength="343.604" font-weight="700">Word order and error-spotter previews</text><text x="109.088" y="2334.96" fill="#E2E8F0" font-size="15.6" textLength="418.816">Tokens: étudiant. / suis / Je   Answer: Je suis étudiant.</text><text x="109.088" y="2376.479" fill="#E2E8F0" font-size="15.6" textLength="526.363">Error prompt: Tu est étudiant.   Incorrect token: est   Correction: es</text><text x="109.088" y="2397.238" fill="#E2E8F0" font-size="15.6" textLength="412.623">Explanation: With tu, use es; est belongs to il or elle.</text><text x="639.351" y="2292.141" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="77.492" y="2507.535" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="109.088" y="2508.835" fill="#E2E8F0" font-size="15.6" textLength="169.467" font-weight="700">Pre-exam feedback</text><text x="109.088" y="2550.354" fill="#E2E8F0" font-size="15.6" textLength="387.311">Individual feedback would be here on production.</text><text x="500.299" y="2507.535" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="77.492" y="2660.651" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="109.088" y="2661.951" fill="#E2E8F0" font-size="15.6" textLength="180.916" font-weight="700">Mixed exam preview</text><text x="109.088" y="2703.469" fill="#E2E8F0" font-size="15.6" textLength="439.268">Page 1: Tu ___ étudiant.   Answer: es   Limit: 30 seconds</text><text x="109.088" y="2724.229" fill="#E2E8F0" font-size="15.6" textLength="488.604">Page 2: nous / vous / ils forms   Answers: sommes / êtes / sont</text><text x="109.088" y="2744.988" fill="#E2E8F0" font-size="15.6" textLength="358.046">Page 2 limit: 60 seconds   /   3 possible points</text><text x="109.088" y="2765.747" fill="#E2E8F0" font-size="15.6" textLength="426.829">Page 3: Order a sentence   /   Limit defined in the brief</text><text x="109.088" y="2786.507" fill="#E2E8F0" font-size="15.6" textLength="506.871">All answers and explanations are visible here for content review.</text><text x="619.859" y="2660.651" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><rect x="78.142" y="2862.214" width="369.2" height="23.359" fill="#EEE" style="stroke:#000;stroke-width:3.25;" rx="6.5" ry="6.5"/><text x="130.39" y="2879.294" fill="#4338CA" font-size="15.6" textLength="264.705">Show all block and exercise items</text><text x="76.192" y="2927.963" fill="#E2E8F0" font-size="15.6" textLength="187.124">[>] Raw JSON (optional)</text><text x="698.664" y="1280.904" fill="#020617" font-size="15.6" textLength="27.696">xxx</text><text x="882.718" y="44.34" fill="#020617" font-size="15.